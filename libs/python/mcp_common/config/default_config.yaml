# MCP 統一客戶端預設配置
# 此檔案定義了統一客戶端的預設設定

# 客戶端類型設定
client_types:
  simple:
    adapter: "simple_adapter"
    description: "Simple MCP 客戶端適配器"
    protocols: ["sqlite"]
    
  mock:
    adapter: "mock_adapter"
    description: "Mock 客戶端（用於測試）"
    protocols: ["any"]

# 預設客戶端
default_client: "simple"

# 連接設定
connections:
  sqlite:
    protocol: "stdio"
    timeout: 30
    retry_attempts: 3
    retry_delay: 1
    
# 錯誤處理
error_handling:
  max_retries: 3
  timeout_seconds: 30
  fallback_enabled: true
  
# 記錄設定
logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(message)s"
  
# 效能設定
performance:
  connection_pool_size: 5
  connection_timeout: 10
  request_timeout: 30
  
# 安全設定
security:
  validate_responses: true
  sanitize_errors: true