[pytest]
# Pytest 配置檔案

# 測試路徑
testpaths = tests

# Python 檔案模式
python_files = test_*.py

# Python 類別模式
python_classes = Test*

# Python 函數模式
python_functions = test_*

# 輸出選項
addopts = 
    -v
    --strict-markers
    --tb=short
    --color=yes
    --asyncio-mode=auto

# 標記定義
markers =
    slow: 標記為慢速測試
    integration: 整合測試
    unit: 單元測試
    asyncio: 非同步測試

# 覆蓋率選項
[coverage:run]
source = mcp_common
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: