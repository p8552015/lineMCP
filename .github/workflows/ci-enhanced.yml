name: Enhanced CI

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  COVERAGE_THRESHOLD: "65"
  ASYNCIO_FORCE_SELECT_SELECTOR: "1"
  # 效能優化環境變數
  PIP_NO_CACHE_DIR: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  POETRY_CACHE_DIR: "/tmp/poetry-cache"
  # Security: Only expose non-sensitive environment variables here
  # Sensitive variables should be set in job steps using secrets.*

jobs:
  python-tests:
    name: Python Tests & Coverage
    runs-on: ubuntu-latest
    # 優化：僅使用單一 Python 版本以提升執行效率
    # 與其他 workflow 保持一致，專注 Python 3.11
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.0
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: apps/bot/.venv
        key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
          venv-${{ runner.os }}-
    
    - name: Install dependencies
      working-directory: apps/bot
      run: |
        if [[ "${{ steps.cached-poetry-dependencies.outputs.cache-hit }}" != 'true' ]]; then
          poetry install --no-interaction --no-ansi
        else
          echo "✅ 使用快取的依賴套件"
        fi
    
    - name: Create test environment file
      working-directory: apps/bot
      run: |
        cat > .env.test << EOF
        LINE_CHANNEL_ACCESS_TOKEN=test_channel_access_token_with_proper_length_for_testing_purposes_only_not_real
        LINE_CHANNEL_SECRET=test_channel_secret_32_characters_long
        GOOGLE_API_KEY=test_google_api_key_for_testing_only
        OPENAI_API_KEY=sk-test-openai-api-key-for-testing-purposes-only
        AI_MODEL_PROVIDER=google
        REDIS_URL=redis://localhost:6379/1
        ASYNCIO_FORCE_SELECT_SELECTOR=1
        EOF
    
    - name: Run unit tests with coverage
      working-directory: apps/bot
      env:
        # Test environment variables from secrets
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
        JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      run: |
        poetry run pytest tests/ \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.COVERAGE_THRESHOLD }} \
          --junitxml=pytest-results.xml \
          --timeout=300 \
          -v
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: apps/bot/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pytest-results
        path: |
          apps/bot/pytest-results.xml
          apps/bot/htmlcov/
    
    - name: Run linting
      working-directory: apps/bot
      run: |
        poetry run ruff check src/ tests/ --output-format=github
    
    - name: Check code formatting
      working-directory: apps/bot
      run: |
        poetry run black --check src/ tests/

  mcp-integration-tests:
    name: MCP Integration Tests
    runs-on: ubuntu-latest
    # 優化：與 API 測試並行執行，提升效率
    needs: python-tests
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.0
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv (MCP)
      id: cached-poetry-dependencies-mcp
      uses: actions/cache@v4
      with:
        path: apps/bot/.venv
        key: venv-mcp-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-mcp-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
          venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
    
    - name: Install dependencies
      working-directory: apps/bot
      run: |
        if [[ "${{ steps.cached-poetry-dependencies-mcp.outputs.cache-hit }}" != 'true' ]]; then
          poetry install --no-interaction --no-ansi
        else
          echo "✅ 使用快取的依賴套件 (MCP 測試)"
        fi
    
    - name: Start SQLite MCP server in background
      run: |
        cd apps/servers/src/sqlite
        python3 server_fixed.py test.db &
        echo $! > /tmp/sqlite-mcp.pid
        sleep 5
    
    - name: Create MCP test environment
      working-directory: apps/bot
      run: |
        cat > .env.test << EOF
        LINE_CHANNEL_ACCESS_TOKEN=test_token
        LINE_CHANNEL_SECRET=test_secret
        GOOGLE_API_KEY=test_google_key
        OPENAI_API_KEY=test_openai_key
        AI_MODEL_PROVIDER=google
        REDIS_URL=redis://localhost:6379/1
        ASYNCIO_FORCE_SELECT_SELECTOR=1
        MCP_SQLITE_SERVER_URL=stdio://python3 apps/servers/src/sqlite/server_fixed.py apps/servers/src/sqlite/test.db
        EOF
    
    - name: Run MCP connection tests
      working-directory: apps/bot
      run: |
        poetry run pytest tests/integration/test_mcp_connection.py -v \
          --timeout=180 \
          --junitxml=mcp-test-results.xml
    
    - name: Run MCP query tests
      working-directory: apps/bot
      run: |
        poetry run pytest tests/integration/test_mcp_queries.py -v \
          --timeout=180 \
          --junitxml=mcp-query-results.xml
    
    - name: Stop MCP server
      if: always()
      run: |
        if [ -f /tmp/sqlite-mcp.pid ]; then
          kill $(cat /tmp/sqlite-mcp.pid) || true
        fi
    
    - name: Upload MCP test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: mcp-test-results
        path: |
          apps/bot/mcp-test-results.xml
          apps/bot/mcp-query-results.xml

  api-integration-tests:
    name: API Integration Tests
    runs-on: ubuntu-latest
    # 優化：與 MCP 測試並行執行，提升效率
    needs: python-tests
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.0
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true
    
    - name: Load cached venv (API)
      id: cached-poetry-dependencies-api
      uses: actions/cache@v4
      with:
        path: apps/bot/.venv
        key: venv-api-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          venv-api-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
          venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-
    
    - name: Install dependencies
      working-directory: apps/bot
      run: |
        if [[ "${{ steps.cached-poetry-dependencies-api.outputs.cache-hit }}" != 'true' ]]; then
          poetry install --no-interaction --no-ansi
        else
          echo "✅ 使用快取的依賴套件 (API 測試)"
        fi
    
    - name: Create API test environment
      working-directory: apps/bot
      run: |
        cat > .env.test << EOF
        LINE_CHANNEL_ACCESS_TOKEN=test_channel_access_token_with_proper_length_for_testing_purposes_only_not_real
        LINE_CHANNEL_SECRET=test_channel_secret_32_characters_long
        GOOGLE_API_KEY=test_google_api_key_for_testing_only
        OPENAI_API_KEY=sk-test-openai-api-key-for-testing-purposes-only
        AI_MODEL_PROVIDER=google
        REDIS_URL=redis://localhost:6379/1
        ASYNCIO_FORCE_SELECT_SELECTOR=1
        EOF
    
    - name: Start FastAPI application in background
      working-directory: apps/bot
      run: |
        poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
        echo $! > fastapi.pid
        sleep 10
    
    - name: Wait for application to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 1; done'
    
    - name: Run API endpoint tests
      working-directory: apps/bot
      run: |
        poetry run pytest tests/integration/test_api_endpoints.py -v \
          --timeout=180 \
          --junitxml=api-test-results.xml
    
    - name: Run webhook tests
      working-directory: apps/bot
      run: |
        poetry run pytest tests/integration/test_webhook.py -v \
          --timeout=180 \
          --junitxml=webhook-test-results.xml
    
    - name: Stop FastAPI application
      if: always()
      run: |
        if [ -f apps/bot/fastapi.pid ]; then
          kill $(cat apps/bot/fastapi.pid) || true
        fi
    
    - name: Upload API test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: api-test-results
        path: |
          apps/bot/api-test-results.xml
          apps/bot/webhook-test-results.xml

  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [python-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Bot Docker image
      uses: docker/build-push-action@v5
      with:
        context: apps/bot
        push: false
        tags: mcp-bot:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Run Trivy vulnerability scanner on Bot image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'mcp-bot:test'
        format: 'sarif'
        output: 'trivy-bot-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif-file: 'trivy-bot-results.sarif'
    

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [python-tests, mcp-integration-tests, api-integration-tests, docker-build]
    if: always()
    
    steps:
    - name: Download all test artifacts
      uses: actions/download-artifact@v4
    
    - name: Generate test summary
      run: |
        echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.python-tests.result }}" == "success" ]; then
          echo "✅ Python Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Python Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.mcp-integration-tests.result }}" == "success" ]; then
          echo "✅ MCP Integration Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ MCP Integration Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.api-integration-tests.result }}" == "success" ]; then
          echo "✅ API Integration Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ API Integration Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        
        if [ "${{ needs.docker-build.result }}" == "success" ]; then
          echo "✅ Docker Build: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Docker Build: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Coverage Reports**: Available in artifacts" >> $GITHUB_STEP_SUMMARY
        echo "🔒 **Security Scans**: Available in Security tab" >> $GITHUB_STEP_SUMMARY
        
    - name: Fail if critical tests failed
      if: needs.python-tests.result == 'failure' || needs.mcp-integration-tests.result == 'failure'
      run: |
        echo "❌ Critical tests failed. Please fix before merging."
        exit 1