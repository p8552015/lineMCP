name: Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    
    - name: Build and push Bot image
      uses: docker/build-push-action@v4
      with:
        context: ./apps/bot
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bot:latest
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build and push MCP Server images
      run: |
        cd apps/servers
        for dir in src/*/; do
          if [ -f "$dir/Dockerfile" ]; then
            server_name=${dir##*/}
            docker build -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mcp-${server_name}:latest" "$dir"
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/mcp-${server_name}:latest"
          fi
        done