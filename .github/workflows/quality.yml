name: Code Quality Checks

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: apps/bot/.venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: Install dependencies
        working-directory: apps/bot
        run: poetry install --no-interaction --no-ansi
        
      - name: Code formatting check (Black)
        working-directory: apps/bot
        run: |
          echo "🔧 跳過 Black 檢查 (已在 Enhanced CI 中執行)"
          
      - name: Import sorting check (isort)
        working-directory: apps/bot
        run: |
          echo "📦 執行 isort 導入排序檢查"
          poetry run isort --check-only src/ --diff || echo "⚠️ 發現導入排序問題，建議執行 isort src/ 修復"
          
      - name: Linting check (Ruff)
        working-directory: apps/bot
        run: |
          echo "🔍 跳過 Ruff 檢查 (已在 Enhanced CI 中執行)"
          
      - name: Type checking (MyPy)
        working-directory: apps/bot
        run: |
          echo "🔍 跳過 MyPy 檢查 (已在 Enhanced CI 中執行)"
          
      - name: Security audit (Bandit)
        working-directory: apps/bot
        run: |
          echo "🔐 跳過 Bandit 檢查 (已在 Security workflow 中執行)"
          
      - name: Upload Bandit report
        run: |
          echo "📤 跳過 Bandit 報告上傳 (已在 Security workflow 中處理)"
          
      - name: Dependency audit (Safety)
        working-directory: apps/bot
        run: |
          echo "🔐 跳過 Safety 檢查 (已在 Security workflow 中執行)"
          
      - name: Upload Safety report
        run: |
          echo "📤 跳過 Safety 報告上傳 (已在 Security workflow 中處理)"

  python-complexity:
    name: Python Code Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install analysis tools
        run: |
          pip install radon xenon mccabe
          
      - name: Cyclomatic complexity check
        working-directory: apps/bot
        run: |
          echo "📊 執行複雜度檢查"
          radon cc src/ --min B --show-complexity || echo "⚠️ 發現高複雜度程式碼，建議重構"
          xenon --max-absolute B --max-modules B --max-average B src/ || echo "⚠️ 複雜度超標，建議優化"
          
      - name: Maintainability index
        working-directory: apps/bot
        run: |
          echo "📈 執行可維護性檢查"
          radon mi src/ --min B || echo "⚠️ 可維護性指數偏低，建議改善"
          
      - name: Raw metrics
        working-directory: apps/bot
        run: radon raw src/ --summary


  docker-quality:
    name: Docker Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Dockerfile linting (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: apps/bot/Dockerfile.optimized
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: error
          
      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          
      - name: Check Dockerfile for security issues
        run: |
          echo "🔍 Checking for common Dockerfile security issues..."
          
          # Check for running as root
          if grep -q "USER root" apps/bot/Dockerfile.optimized; then
            echo "⚠️  Warning: Running as root user detected"
          fi
          
          # Check for COPY --chown usage
          if ! grep -q "COPY --chown" apps/bot/Dockerfile.optimized; then
            echo "💡 Suggestion: Consider using COPY --chown for better security"
          fi
          
          # Check for specific version pinning
          if grep -q "FROM.*:latest" apps/bot/Dockerfile.optimized; then
            echo "⚠️  Warning: Using 'latest' tag detected. Consider pinning specific versions."
          fi

  commit-quality:
    name: Commit Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Conventional Commits check
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          
      - name: Check commit message length
        run: |
          commits=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          while IFS= read -r commit; do
            message=$(echo "$commit" | cut -d' ' -f2-)
            if [ ${#message} -gt 72 ]; then
              echo "❌ Commit message too long: $message"
              exit 1
            fi
          done <<< "$commits"

  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check markdown files
        uses: DavidAnson/markdownlint-cli2-action@v20
        continue-on-error: true
        with:
          config: .markdownlint.json
          globs: |
            **/*.md
            !venv/**/*.md
            !node_modules/**/*.md
            !**/site-packages/**/*.md
            !code_audit_reports/**/*.md
            !CICD/file/**/*.md
            !**/dist-info/**/*.md
          
      - name: Manual markdown check (fallback)
        if: failure()
        run: |
          echo "🔍 Markdownlint action failed, running manual check..."
          # Install markdownlint-cli if not available
          npm install -g markdownlint-cli || echo "⚠️ Failed to install markdownlint-cli"
          
          # Run markdownlint on key documentation files
          echo "📋 Checking main documentation files..."
          for file in README.md CLAUDE.md docs/**/*.md; do
            if [ -f "$file" ]; then
              echo "Checking: $file"
              markdownlint "$file" --config .markdownlint.json || echo "⚠️ Issues found in $file"
            fi
          done
          
      - name: Check for TODO/FIXME comments
        run: |
          echo "🔍 Checking for TODO/FIXME comments..."
          todo_count=$(grep -r "TODO\|FIXME" apps/bot/src/ --exclude-dir=__pycache__ | wc -l)
          if [ $todo_count -gt 10 ]; then
            echo "⚠️  High number of TODO/FIXME comments: $todo_count"
            echo "Consider addressing some of these before merging."
          fi
          
      - name: Check README files exist
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ Root README.md not found"
            exit 1
          fi
          if [ ! -f "apps/bot/README.md" ]; then
            echo "⚠️  Bot README.md not found"
          fi

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python-quality, python-complexity, docker-quality, documentation-quality]
    if: always()
    
    steps:
      - name: Quality Gates Summary
        run: |
          # Use safer English text to avoid encoding issues
          echo "## 🎯 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Check Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Calculate statistics
          total_checks=0
          passed_checks=0
          
          # Python Quality Check
          total_checks=$((total_checks + 1))
          if [ "${{ needs.python-quality.result }}" == "success" ]; then
            echo "✅ **Python Code Quality**: PASSED" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **Python Code Quality**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Python Complexity Check
          total_checks=$((total_checks + 1))
          if [ "${{ needs.python-complexity.result }}" == "success" ]; then
            echo "✅ **Code Complexity**: PASSED" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **Code Complexity**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Docker Quality Check
          total_checks=$((total_checks + 1))
          if [ "${{ needs.docker-quality.result }}" == "success" ]; then
            echo "✅ **Docker Quality**: PASSED" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **Docker Quality**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Documentation Quality Check
          total_checks=$((total_checks + 1))
          if [ "${{ needs.documentation-quality.result }}" == "success" ]; then
            echo "✅ **Documentation Quality**: PASSED (includes markdownlint)" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **Documentation Quality**: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Commit Quality Check (PR only)
          echo "⏸️ **Commit Quality**: SKIPPED (PR only)" >> $GITHUB_STEP_SUMMARY
          
          # Calculate pass rate
          if [ $total_checks -gt 0 ]; then
            pass_rate=$((passed_checks * 100 / total_checks))
          else
            pass_rate=0
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Check Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Checks**: $total_checks" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed**: $passed_checks" >> $GITHUB_STEP_SUMMARY
          echo "- **Pass Rate**: ${pass_rate}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $pass_rate -eq 100 ]; then
            echo "🎉 **Overall Status**: All quality checks passed!" >> $GITHUB_STEP_SUMMARY
          elif [ $pass_rate -ge 80 ]; then
            echo "⚠️ **Overall Status**: Most checks passed, some need attention" >> $GITHUB_STEP_SUMMARY
          else
            echo "🚨 **Overall Status**: Multiple checks failed, requires immediate fix" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔧 Improvement Suggestions" >> $GITHUB_STEP_SUMMARY
          echo "- Check detailed logs for failed checks" >> $GITHUB_STEP_SUMMARY
          echo "- Run local quality checks: \`cd apps/bot && poetry run black src/ && poetry run ruff check src/\`" >> $GITHUB_STEP_SUMMARY
          echo "- Check documentation format: \`markdownlint *.md\`" >> $GITHUB_STEP_SUMMARY
          
      - name: Fail if any quality check failed
        if: needs.python-quality.result == 'failure' || needs.python-complexity.result == 'failure' || needs.docker-quality.result == 'failure' || needs.documentation-quality.result == 'failure'
        run: |
          echo "🚨 一個或多個品質檢查失敗"
          echo "Python Quality: ${{ needs.python-quality.result }}"
          echo "Python Complexity: ${{ needs.python-complexity.result }}"
          echo "Docker Quality: ${{ needs.docker-quality.result }}"
          echo "Documentation Quality: ${{ needs.documentation-quality.result }}"
          echo "Commit Quality: 跳過 (僅限 Pull Request)"
          exit 1