name: Code Quality Checks

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true
          
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: apps/bot/.venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          
      - name: Install dependencies
        working-directory: apps/bot
        run: poetry install --no-interaction --no-ansi
        
      - name: Code formatting check (Black)
        working-directory: apps/bot
        run: |
          echo "🔧 執行 Black 格式檢查"
          poetry run black --check src/ --diff || echo "⚠️ 發現格式問題，建議執行 black src/ 修復"
          
      - name: Import sorting check (isort)
        working-directory: apps/bot
        run: |
          echo "📦 執行 isort 導入排序檢查"
          poetry run isort --check-only src/ --diff || echo "⚠️ 發現導入排序問題，建議執行 isort src/ 修復"
          
      - name: Linting check (Ruff)
        working-directory: apps/bot
        run: |
          echo "🔍 執行 Ruff 程式碼檢查"
          poetry run ruff check src/ --output-format=github || echo "⚠️ 發現程式碼風格問題，建議執行 ruff check src/ --fix 修復"
          
      - name: Type checking (MyPy)
        working-directory: apps/bot
        run: |
          echo "🔍 執行 MyPy 類型檢查"
          poetry run mypy src/ || echo "⚠️ 發現類型註解問題，建議檢查並修復"
          
      - name: Security audit (Bandit)
        working-directory: apps/bot
        run: |
          echo "🔐 執行 Bandit 安全檢查"
          poetry run bandit -r src/ -f json -o bandit-report.json || true
          poetry run bandit -r src/ || echo "⚠️ 發現安全問題，請檢查 bandit-report.json"
          
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: apps/bot/bandit-report.json
          
      - name: Dependency audit (Safety)
        working-directory: apps/bot
        run: |
          echo "🔍 執行 Safety 依賴檢查"
          poetry run safety check --json --output safety-report.json || true
          poetry run safety check || echo "⚠️ 發現依賴安全問題，請檢查 safety-report.json"
          
      - name: Upload Safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: apps/bot/safety-report.json

  python-complexity:
    name: Python Code Complexity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install analysis tools
        run: |
          pip install radon xenon mccabe
          
      - name: Cyclomatic complexity check
        working-directory: apps/bot
        run: |
          echo "📊 執行複雜度檢查"
          radon cc src/ --min B --show-complexity || echo "⚠️ 發現高複雜度程式碼，建議重構"
          xenon --max-absolute B --max-modules B --max-average B src/ || echo "⚠️ 複雜度超標，建議優化"
          
      - name: Maintainability index
        working-directory: apps/bot
        run: |
          echo "📈 執行可維護性檢查"
          radon mi src/ --min B || echo "⚠️ 可維護性指數偏低，建議改善"
          
      - name: Raw metrics
        working-directory: apps/bot
        run: radon raw src/ --summary


  docker-quality:
    name: Docker Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Dockerfile linting (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/bot/Dockerfile.optimized
          format: sarif
          output-file: hadolint-results.sarif
          
      - name: Upload Hadolint results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif-file: hadolint-results.sarif
          
      - name: Check Dockerfile for security issues
        run: |
          echo "🔍 Checking for common Dockerfile security issues..."
          
          # Check for running as root
          if grep -q "USER root" apps/bot/Dockerfile.optimized; then
            echo "⚠️  Warning: Running as root user detected"
          fi
          
          # Check for COPY --chown usage
          if ! grep -q "COPY --chown" apps/bot/Dockerfile.optimized; then
            echo "💡 Suggestion: Consider using COPY --chown for better security"
          fi
          
          # Check for specific version pinning
          if grep -q "FROM.*:latest" apps/bot/Dockerfile.optimized; then
            echo "⚠️  Warning: Using 'latest' tag detected. Consider pinning specific versions."
          fi

  commit-quality:
    name: Commit Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Conventional Commits check
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          
      - name: Check commit message length
        run: |
          commits=$(git log --oneline ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          while IFS= read -r commit; do
            message=$(echo "$commit" | cut -d' ' -f2-)
            if [ ${#message} -gt 72 ]; then
              echo "❌ Commit message too long: $message"
              exit 1
            fi
          done <<< "$commits"

  documentation-quality:
    name: Documentation Quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Check markdown files
        uses: DavidAnson/markdownlint-action@v1.15.0
        with:
          files: '**/*.md'
          config: .markdownlint.json
          ignore: ''
          
      - name: Check for TODO/FIXME comments
        run: |
          echo "🔍 Checking for TODO/FIXME comments..."
          todo_count=$(grep -r "TODO\|FIXME" apps/bot/src/ --exclude-dir=__pycache__ | wc -l)
          if [ $todo_count -gt 10 ]; then
            echo "⚠️  High number of TODO/FIXME comments: $todo_count"
            echo "Consider addressing some of these before merging."
          fi
          
      - name: Check README files exist
        run: |
          if [ ! -f "README.md" ]; then
            echo "❌ Root README.md not found"
            exit 1
          fi
          if [ ! -f "apps/bot/README.md" ]; then
            echo "⚠️  Bot README.md not found"
          fi

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python-quality, python-complexity, docker-quality, commit-quality, documentation-quality]
    if: always()
    
    steps:
      - name: Quality Gates Summary
        run: |
          echo "## 🎯 Code Quality Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.python-quality.result }}" == "success" ]; then
            echo "✅ Python Quality: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python Quality: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.python-complexity.result }}" == "success" ]; then
            echo "✅ Code Complexity: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Code Complexity: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          
          if [ "${{ needs.docker-quality.result }}" == "success" ]; then
            echo "✅ Docker Quality: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Docker Quality: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Overall Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Fail if any quality check failed
        if: needs.python-quality.result == 'failure' || needs.python-complexity.result == 'failure' || needs.docker-quality.result == 'failure'
        run: exit 1