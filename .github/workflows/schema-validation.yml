name: Database Schema Validation

on:
  push:
    branches: [ main, develop, feature/* ]
    paths:
      - 'postgres-init/**'
      - 'schema/**'
      - 'apps/bot/src/**'
      - 'apps/bot/tests/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'postgres-init/**'
      - 'schema/**'
      - 'apps/bot/src/**'
      - 'apps/bot/tests/**'
  workflow_dispatch:
    inputs:
      force_check:
        description: '強制執行完整檢查'
        required: false
        default: 'false'
        type: boolean

env:
  POSTGRES_DB: mydb
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: admin
  DATABASE_URL: postgresql://admin:admin@localhost:5432/mydb

jobs:
  schema-validation:
    name: 🔍 Database Schema Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg

      - name: 🏗️ Initialize database
        run: |
          # 等待 PostgreSQL 服務完全啟動
          until pg_isready -h localhost -p 5432 -U ${{ env.POSTGRES_USER }}; do
            echo "等待 PostgreSQL 啟動..."
            sleep 2
          done
          
          # 執行資料庫初始化腳本
          PGPASSWORD=${{ env.POSTGRES_PASSWORD }} psql \
            -h localhost \
            -U ${{ env.POSTGRES_USER }} \
            -d ${{ env.POSTGRES_DB }} \
            -f postgres-init/01-init-data.sql

      - name: 🔍 Run schema consistency check
        id: schema_check
        run: |
          echo "🔍 執行 Schema 一致性檢查..."
          
          # 給腳本執行權限
          chmod +x scripts/check-schema.sh
          
          # 執行檢查（詳細模式）
          if ./scripts/check-schema.sh --verbose "${{ env.DATABASE_URL }}"; then
            echo "result=success" >> $GITHUB_OUTPUT
            echo "message=Schema 一致性檢查通過" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            echo "message=Schema 一致性檢查失敗" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: 📊 Validate test database integration
        if: always()
        run: |
          echo "🧪 驗證資料庫整合測試..."
          
          # 設定 Python 環境
          cd apps/bot
          python -m pip install poetry
          poetry config virtualenvs.create false
          poetry install --only=main,test
          
          # 執行資料庫整合測試
          poetry run pytest tests/integration/test_database_integration.py -v \
            --tb=short \
            --maxfail=5

      - name: 🚨 Schema validation failure notification
        if: failure() && steps.schema_check.outputs.result == 'failure'
        run: |
          echo "❌ Schema 驗證失敗！"
          echo ""
          echo "🔧 可能的原因："
          echo "1. 資料庫 Schema 與期望規範不一致"
          echo "2. 缺少必要的表格或欄位"
          echo "3. 外鍵約束配置錯誤"
          echo "4. 索引定義不完整"
          echo ""
          echo "💡 修復建議："
          echo "1. 檢查 postgres-init/01-init-data.sql 檔案"
          echo "2. 更新 schema/expected-schema.json 規範"
          echo "3. 執行本地 Schema 檢查: ./scripts/check-schema.sh --verbose"
          echo "4. 修復不一致問題後重新提交"

      - name: 📈 Upload schema validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-report-${{ github.sha }}
          path: |
            schema/expected-schema.json
            postgres-init/01-init-data.sql
          retention-days: 30

  schema-drift-detection:
    name: 🔄 Schema Drift Detection
    runs-on: ubuntu-latest
    needs: schema-validation
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout PR code
        uses: actions/checkout@v4

      - name: 📥 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: 🔍 Detect schema changes
        run: |
          echo "🔄 檢測 Schema 變更..."
          
          # 比較 Schema 檔案
          if ! diff -u main-branch/schema/expected-schema.json schema/expected-schema.json > schema-diff.txt; then
            echo "📋 發現 Schema 規範變更："
            cat schema-diff.txt
            echo "schema_changed=true" >> $GITHUB_ENV
          else
            echo "✅ Schema 規範無變更"
            echo "schema_changed=false" >> $GITHUB_ENV
          fi
          
          # 比較資料庫初始化腳本
          if ! diff -u main-branch/postgres-init/01-init-data.sql postgres-init/01-init-data.sql > init-diff.txt; then
            echo "📋 發現資料庫初始化腳本變更："
            cat init-diff.txt
            echo "init_changed=true" >> $GITHUB_ENV
          else
            echo "✅ 資料庫初始化腳本無變更"
            echo "init_changed=false" >> $GITHUB_ENV
          fi

      - name: 📝 Comment on PR with schema changes
        if: env.schema_changed == 'true' || env.init_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 Database Schema Changes Detected\n\n';
            
            if (process.env.schema_changed === 'true') {
              comment += '### 📋 Schema 規範變更\n';
              comment += '```diff\n';
              try {
                const schemaDiff = fs.readFileSync('schema-diff.txt', 'utf8');
                comment += schemaDiff;
              } catch (e) {
                comment += '無法讀取 Schema 變更內容\n';
              }
              comment += '\n```\n\n';
            }
            
            if (process.env.init_changed === 'true') {
              comment += '### 🏗️ 資料庫初始化腳本變更\n';
              comment += '```diff\n';
              try {
                const initDiff = fs.readFileSync('init-diff.txt', 'utf8');
                comment += initDiff;
              } catch (e) {
                comment += '無法讀取初始化腳本變更內容\n';
              }
              comment += '\n```\n\n';
            }
            
            comment += '### ⚠️ 請確認\n';
            comment += '- [ ] Schema 變更已經過仔細審查\n';
            comment += '- [ ] 相關的遷移腳本已準備就緒\n';
            comment += '- [ ] 測試已更新以反映 Schema 變更\n';
            comment += '- [ ] 文檔已更新\n\n';
            comment += '### 🔧 驗證建議\n';
            comment += '```bash\n';
            comment += '# 本地驗證 Schema 一致性\n';
            comment += './scripts/check-schema.sh --verbose\n\n';
            comment += '# 執行完整資料庫測試\n';
            comment += 'cd apps/bot && poetry run pytest tests/integration/test_database_integration.py -v\n';
            comment += '```\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: 📊 Upload diff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-report-${{ github.sha }}
          path: |
            schema-diff.txt
            init-diff.txt
          retention-days: 14