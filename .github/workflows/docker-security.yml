name: 🔒 Docker Security Scan (Enhanced)

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main, develop, 'feature/*' ]
    paths:
      - 'apps/bot/Dockerfile*'
      - 'apps/bot/pyproject.toml'
      - 'apps/bot/src/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/bot/Dockerfile*'
      - 'apps/bot/pyproject.toml'
      - 'apps/bot/src/**'
  schedule:
    # 每日 UTC 02:00 執行
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/line-mcp-bot
  PYTHON_VERSION: "3.11"

jobs:
  
  # ================================
  # Dockerfile 基本安全檢查
  # ================================
  dockerfile-security-check:
    name: 📄 Dockerfile 安全檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Dockerfile 安全掃描 (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: apps/bot/Dockerfile.optimized
          format: sarif
          output-file: hadolint-results.sarif
          failure-threshold: error
          no-fail: true

      - name: 📤 Upload Hadolint Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif

      - name: 🔍 基本 Dockerfile 安全檢查
        run: |
          echo "🔍 執行基本 Dockerfile 安全檢查..."
          
          dockerfile="apps/bot/Dockerfile.optimized"
          security_issues=0
          
          # 檢查是否使用 root 用戶
          if grep -q "USER.*root\|^USER.*0$" "$dockerfile"; then
            echo "❌ 發現 root 用戶使用"
            security_issues=$((security_issues + 1))
          else
            echo "✅ 未使用 root 用戶"
          fi
          
          # 檢查是否有健康檢查
          if ! grep -q "HEALTHCHECK" "$dockerfile"; then
            echo "⚠️ 缺少健康檢查配置"
          else
            echo "✅ 包含健康檢查配置"
          fi
          
          # 檢查是否清理 apt 快取
          if ! grep -q "rm -rf /var/lib/apt/lists" "$dockerfile"; then
            echo "⚠️ 未清理 apt 快取"
          else
            echo "✅ 正確清理 apt 快取"
          fi
          
          # 檢查是否固定基礎映像版本
          if grep -q "FROM.*:latest" "$dockerfile"; then
            echo "⚠️ 使用 latest 標籤"
          else
            echo "✅ 使用固定版本標籤"
          fi
          
          # 檢查敏感信息
          if grep -i "password\|secret\|token\|key" "$dockerfile" | grep -v "ARG\|ENV.*=\$"; then
            echo "❌ 可能包含硬編碼敏感信息"
            security_issues=$((security_issues + 1))
          else
            echo "✅ 未發現硬編碼敏感信息"
          fi
          
          if [ $security_issues -gt 0 ]; then
            echo "⚠️ 發現 $security_issues 個安全問題，請檢查"
            # 不退出失敗，只警告
          else
            echo "✅ Dockerfile 基本安全檢查通過"
          fi

  # ================================
  # 容器映像漏洞掃描
  # ================================
  image-vulnerability-scan:
    name: 🐳 映像漏洞掃描
    runs-on: ubuntu-latest
    needs: dockerfile-security-check
    timeout-minutes: 20
    strategy:
      matrix:
        target: [production]  # 只掃描生產映像以減少複雜度
      fail-fast: false
    
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/bot
          file: ./apps/bot/Dockerfile.optimized
          target: ${{ matrix.target }}
          load: true
          tags: test-image:${{ matrix.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_USER=appuser
            APP_UID=1000
            APP_GID=1000

      - name: 🔍 Trivy 漏洞掃描
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-image:${{ matrix.target }}
          format: 'sarif'
          output: 'trivy-${{ matrix.target }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # 不因漏洞而失敗

      - name: 📤 Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.target }}.sarif'
          category: 'trivy-${{ matrix.target }}'

      - name: 🔍 Trivy 表格格式報告
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: test-image:${{ matrix.target }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: 📋 映像信息檢查
        run: |
          echo "🔍 檢查映像基本信息..."
          docker images test-image:${{ matrix.target }}
          
          echo "📦 檢查映像層級..."
          docker history test-image:${{ matrix.target }} --no-trunc
          
          echo "👤 檢查用戶配置..."
          docker run --rm test-image:${{ matrix.target }} id
          
          echo "🔐 檢查權限配置..."
          docker run --rm test-image:${{ matrix.target }} ls -la /app

  # ================================
  # 容器配置安全檢查
  # ================================
  container-security-check:
    name: 🏃 容器安全檢查
    runs-on: ubuntu-latest
    needs: [image-vulnerability-scan]
    timeout-minutes: 15
    
    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/bot
          file: ./apps/bot/Dockerfile.optimized
          target: production
          load: true
          tags: security-test:latest
          build-args: |
            APP_USER=appuser
            APP_UID=1000
            APP_GID=1000

      - name: 🏃 基本容器安全檢查
        run: |
          echo "🔍 執行容器基本安全檢查..."
          
          # 檢查容器是否能正常啟動
          echo "📦 測試容器啟動..."
          container_id=$(docker run -d --name security-test \
            -e ENVIRONMENT=testing \
            -e LOG_LEVEL=WARNING \
            security-test:latest sleep 30)
          
          # 等待容器啟動
          sleep 5
          
          # 檢查容器狀態
          if docker ps | grep -q security-test; then
            echo "✅ 容器成功啟動"
          else
            echo "❌ 容器啟動失敗"
            docker logs security-test
            exit 1
          fi
          
          # 檢查用戶權限
          echo "👤 檢查用戶權限..."
          user_info=$(docker exec security-test id)
          if echo "$user_info" | grep -q "uid=1000.*gid=1000"; then
            echo "✅ 使用非 root 用戶: $user_info"
          else
            echo "⚠️ 用戶配置: $user_info"
          fi
          
          # 檢查文件權限
          echo "🔐 檢查應用目錄權限..."
          docker exec security-test ls -la /app
          
          # 檢查進程
          echo "🔍 檢查運行進程..."
          docker exec security-test ps aux
          
          # 清理
          docker stop security-test
          docker rm security-test
          
          echo "✅ 容器安全檢查完成"

  # ================================
  # 安全報告總結
  # ================================
  security-summary:
    name: 📊 安全掃描總結
    runs-on: ubuntu-latest
    needs: [dockerfile-security-check, image-vulnerability-scan, container-security-check]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: 📊 生成安全掃描總結
        run: |
          echo "## 🔒 Docker 安全掃描總結" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**掃描時間**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Dockerfile 檢查結果
          if [ "${{ needs.dockerfile-security-check.result }}" == "success" ]; then
            echo "✅ **Dockerfile 安全檢查**: 通過" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Dockerfile 安全檢查**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 映像漏洞掃描結果
          if [ "${{ needs.image-vulnerability-scan.result }}" == "success" ]; then
            echo "✅ **映像漏洞掃描**: 通過" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **映像漏洞掃描**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 容器安全檢查結果
          if [ "${{ needs.container-security-check.result }}" == "success" ]; then
            echo "✅ **容器安全檢查**: 通過" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **容器安全檢查**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 安全建議" >> $GITHUB_STEP_SUMMARY
          echo "- 定期更新基礎映像和依賴" >> $GITHUB_STEP_SUMMARY
          echo "- 保持最小權限原則" >> $GITHUB_STEP_SUMMARY
          echo "- 監控漏洞掃描報告" >> $GITHUB_STEP_SUMMARY
          echo "- 實施容器運行時安全策略" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **詳細掃描結果請查看各個 Job 的日誌和 Artifacts**" >> $GITHUB_STEP_SUMMARY

      - name: 🎯 檢查關鍵失敗
        if: |
          needs.dockerfile-security-check.result == 'failure' || 
          needs.container-security-check.result == 'failure'
        run: |
          echo "❌ 關鍵安全檢查失敗"
          echo "Dockerfile 檢查: ${{ needs.dockerfile-security-check.result }}"
          echo "容器安全檢查: ${{ needs.container-security-check.result }}"
          # 映像漏洞掃描失敗不阻止流程，因為可能只是警告

  # ================================
  # 最終狀態檢查
  # ================================
  final-status:
    name: ✅ 最終狀態檢查
    runs-on: ubuntu-latest
    needs: [dockerfile-security-check, image-vulnerability-scan, container-security-check, security-summary]
    if: always()
    timeout-minutes: 2
    
    steps:
      - name: 📋 工作流程完成狀態
        run: |
          echo "🎯 Docker 安全掃描工作流程完成"
          echo "Dockerfile 安全檢查: ${{ needs.dockerfile-security-check.result }}"
          echo "映像漏洞掃描: ${{ needs.image-vulnerability-scan.result }}"
          echo "容器安全檢查: ${{ needs.container-security-check.result }}"
          echo "安全掃描總結: ${{ needs.security-summary.result }}"
          
          # 統計成功的作業數
          success_count=0
          total_count=4
          
          if [ "${{ needs.dockerfile-security-check.result }}" == "success" ]; then
            success_count=$((success_count + 1))
          fi
          
          if [ "${{ needs.image-vulnerability-scan.result }}" == "success" ]; then
            success_count=$((success_count + 1))
          fi
          
          if [ "${{ needs.container-security-check.result }}" == "success" ]; then
            success_count=$((success_count + 1))
          fi
          
          if [ "${{ needs.security-summary.result }}" == "success" ]; then
            success_count=$((success_count + 1))
          fi
          
          success_rate=$((success_count * 100 / total_count))
          
          echo "✅ 總體成功率: ${success_rate}% (${success_count}/${total_count})"
          
          if [ $success_count -ge 3 ]; then
            echo "🎉 Docker 安全掃描基本通過"
          else
            echo "⚠️ Docker 安全掃描需要關注"
          fi