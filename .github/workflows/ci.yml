name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      uses: snok/install-poetry@v1
    
    - name: Install dependencies
      run: |
        cd apps/bot
        poetry install
    
    - name: Run tests
      run: |
        cd apps/bot
        poetry run pytest tests/
    
    - name: Run linting
      run: |
        cd apps/bot
        poetry run ruff check .
    
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install dependencies
      run: |
        cd apps/servers
        npm ci
    
    - name: Build
      run: |
        cd apps/servers
        npm run build --workspaces --if-present
    
    - name: Test
      run: |
        cd apps/servers
        npm test --workspaces --if-present
  
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Bot Docker image
      run: |
        cd apps/bot
        docker build -t mcp-bot:test .
    
    - name: Build MCP Servers Docker images
      run: |
        cd apps/servers
        for dir in src/*/; do
          if [ -f "$dir/Dockerfile" ]; then
            docker build -t "mcp-${dir##*/}:test" "$dir"
          fi
        done