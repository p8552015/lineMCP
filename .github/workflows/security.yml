name: Security & Compliance Checks (Simplified)

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天凌晨 2 點執行安全掃描
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: "3.11"

jobs:
  basic-security-check:
    name: Basic Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Basic secrets detection
        run: |
          echo "🔍 執行基本安全檢查..."
          
          # 簡單的機密檢查（不使用外部工具）
          if grep -r -i "password\|secret\|token\|key" apps/bot/src/ --include="*.py" | grep -E "(=|:)\s*['\"][^'\"]{10,}['\"]"; then
            echo "⚠️ 發現可能的硬編碼機密"
            echo "請檢查以上項目是否為實際機密"
          else
            echo "✅ 基本機密檢查通過"
          fi
          
          # 檢查環境變數使用是否正確
          echo "📋 檢查環境變數使用..."
          grep -r "os.environ\|getenv" apps/bot/src/ --include="*.py" | head -5
          echo "✅ 環境變數檢查完成"

  python-security-check:
    name: Python Security Check (Basic)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0
      
      - name: Basic Python security check
        working-directory: apps/bot
        run: |
          echo "🐍 執行 Python 基本安全檢查..."
          
          # 檢查 Poetry 鎖定文件是否存在
          if [ -f "poetry.lock" ]; then
            echo "✅ poetry.lock 存在，依賴版本已鎖定"
          else
            echo "⚠️ poetry.lock 不存在"
          fi
          
          # 簡單的依賴檢查（不安裝外部工具）
          poetry export -f requirements.txt --output requirements-check.txt --without-hashes || true
          
          if [ -f "requirements-check.txt" ]; then
            echo "📦 主要依賴套件："
            head -10 requirements-check.txt
            echo "✅ 依賴導出成功"
          fi
          
          # 基本的代碼安全模式檢查
          echo "🔍 檢查常見安全問題..."
          if grep -r "eval\|exec\|subprocess.call" src/ --include="*.py" | head -3; then
            echo "⚠️ 發現潛在的代碼執行風險，請檢查"
          else
            echo "✅ 未發現明顯的代碼執行風險"
          fi

  basic-compliance:
    name: Basic Compliance Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Basic compliance verification
        run: |
          echo "📋 執行基本合規檢查..."
          
          # 檢查是否有 LICENSE 文件
          if [ -f "LICENSE" ] || [ -f "LICENSE.md" ] || [ -f "LICENCE" ]; then
            echo "✅ 發現 LICENSE 文件"
            ls -la LICENSE* 2>/dev/null || true
          else
            echo "⚠️ 未發現 LICENSE 文件"
          fi
          
          # 檢查是否有 README
          if [ -f "README.md" ] || [ -f "README.rst" ]; then
            echo "✅ 發現 README 文件"
          else
            echo "⚠️ 未發現 README 文件"
          fi
          
          # 簡單的代碼結構檢查
          echo "📂 主要目錄結構："
          find . -type d -name "src" -o -name "tests" -o -name "docs" | head -5
          
          echo "✅ 基本合規檢查完成"

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [basic-security-check, python-security-check, basic-compliance]
    if: always()
    
    steps:
      - name: Generate security summary
        run: |
          echo "## 🔒 Security Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.basic-security-check.result }}" == "success" ]; then
            echo "✅ Basic Security Check: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Basic Security Check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.python-security-check.result }}" == "success" ]; then
            echo "✅ Python Security Check: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Python Security Check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.basic-compliance.result }}" == "success" ]; then
            echo "✅ Basic Compliance Check: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Basic Compliance Check: FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Note**: This is a simplified security check focused on core functionality." >> $GITHUB_STEP_SUMMARY