name: Security & Compliance Checks (Enhanced)

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天凌晨 2 點執行安全掃描
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  secrets-detection:
    name: 🔍 機密檢測
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整歷史記錄掃描
      
      - name: 🔍 TruffleHog 機密掃描
        uses: trufflesecurity/trufflehog@v3.89.2
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
      
      - name: 🔍 基本機密模式檢查
        run: |
          echo "🔍 執行基本機密檢查..."
          
          # 檢查常見機密模式
          secret_patterns=(
            "password\s*=\s*['\"][^'\"]{8,}['\"]"
            "secret\s*=\s*['\"][^'\"]{20,}['\"]"
            "token\s*=\s*['\"][^'\"]{20,}['\"]"
            "api_key\s*=\s*['\"][^'\"]{20,}['\"]"
            "['\"][A-Za-z0-9]{32,}['\"]"
          )
          
          found_secrets=false
          for pattern in "${secret_patterns[@]}"; do
            if grep -r -E -i "$pattern" apps/bot/src/ --include="*.py"; then
              echo "⚠️ 發現可能的硬編碼機密: $pattern"
              found_secrets=true
            fi
          done
          
          if [ "$found_secrets" = false ]; then
            echo "✅ 基本機密檢查通過"
          else
            echo "❌ 發現潛在機密，請檢查"
            # 不立即失敗，讓其他檢查繼續
          fi
          
          # 檢查環境變數使用
          echo "📋 檢查環境變數使用模式..."
          env_usage=$(grep -r "os.environ\|getenv" apps/bot/src/ --include="*.py" | wc -l)
          echo "發現 $env_usage 處環境變數使用"
          
          if [ $env_usage -gt 0 ]; then
            echo "✅ 正確使用環境變數"
          else
            echo "⚠️ 未發現環境變數使用"
          fi

  code-security-analysis:
    name: 🐍 代碼安全分析
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        working-directory: apps/bot
        run: |
          poetry config installer.parallel true
          poetry install --no-interaction --with dev
      
      - name: 🔍 Bandit 安全掃描
        working-directory: apps/bot
        run: |
          echo "🔍 執行 Bandit 安全掃描..."
          poetry run bandit -r src/ -f json -o bandit-report.json || true
          poetry run bandit -r src/ -ll || echo "⚠️ 發現安全問題，請檢查"
      
      - name: 📤 Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: apps/bot/bandit-report.json
      
      - name: 🔍 Safety 依賴漏洞檢查
        working-directory: apps/bot
        run: |
          echo "🔍 執行依賴安全檢查..."
          poetry run safety check --json --output safety-report.json || echo "⚠️ 發現依賴漏洞"
          poetry run safety check || echo "⚠️ 依賴安全檢查發現問題"
      
      - name: 📤 Upload Safety Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-vulnerability-report
          path: apps/bot/safety-report.json

  codeql-analysis:
    name: 🧬 CodeQL 分析
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    
    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  compliance-check:
    name: 📋 合規性檢查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: 🔍 項目結構合規檢查
        run: |
          echo "📋 執行項目結構合規檢查..."
          
          compliance_issues=0
          
          # 檢查必要文件
          echo "📄 檢查必要文件..."
          if [ -f "LICENSE" ] || [ -f "LICENSE.md" ] || [ -f "LICENCE" ]; then
            echo "✅ LICENSE 文件存在"
          else
            echo "⚠️ 缺少 LICENSE 文件"
            compliance_issues=$((compliance_issues + 1))
          fi
          
          if [ -f "README.md" ]; then
            echo "✅ README.md 存在"
          else
            echo "⚠️ 缺少 README.md"
            compliance_issues=$((compliance_issues + 1))
          fi
          
          if [ -f ".gitignore" ]; then
            echo "✅ .gitignore 存在"
          else
            echo "⚠️ 缺少 .gitignore"
          fi
          
          # 檢查敏感文件
          echo "🔒 檢查敏感文件..."
          sensitive_files=(".env" "*.key" "*.pem" "id_rsa" "id_dsa")
          for pattern in "${sensitive_files[@]}"; do
            if find . -name "$pattern" -not -path "./.git/*" | grep -q .; then
              echo "❌ 發現敏感文件: $pattern"
              compliance_issues=$((compliance_issues + 1))
            fi
          done
          
          # 檢查代碼結構
          echo "📂 檢查代碼結構..."
          if [ -d "apps/bot/src" ]; then
            echo "✅ 源代碼目錄結構正確"
          else
            echo "⚠️ 源代碼目錄結構異常"
          fi
          
          if [ -d "apps/bot/tests" ] || [ -d "CICD/tests" ]; then
            echo "✅ 測試目錄存在"
          else
            echo "⚠️ 缺少測試目錄"
          fi
          
          # 檢查配置文件
          echo "⚙️ 檢查配置文件..."
          if [ -f "apps/bot/pyproject.toml" ]; then
            echo "✅ Python 項目配置文件存在"
          else
            echo "⚠️ 缺少 pyproject.toml"
          fi
          
          echo "📊 合規檢查總結："
          echo "發現 $compliance_issues 個合規問題"
          
          if [ $compliance_issues -eq 0 ]; then
            echo "✅ 合規檢查全部通過"
          elif [ $compliance_issues -le 2 ]; then
            echo "⚠️ 合規檢查基本通過，有輕微問題"
          else
            echo "❌ 合規檢查發現較多問題，需要關注"
          fi

  security-summary:
    name: 📊 安全檢查總結
    runs-on: ubuntu-latest
    needs: [secrets-detection, code-security-analysis, codeql-analysis, compliance-check]
    if: always()
    timeout-minutes: 5
    
    steps:
      - name: 📊 生成安全檢查總結
        run: |
          echo "## 🔒 安全與合規檢查總結" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**檢查時間**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**提交**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 統計各項檢查結果
          total_checks=4
          passed_checks=0
          
          # 機密檢測結果
          if [ "${{ needs.secrets-detection.result }}" == "success" ]; then
            echo "✅ **機密檢測**: 通過" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **機密檢測**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 代碼安全分析結果
          if [ "${{ needs.code-security-analysis.result }}" == "success" ]; then
            echo "✅ **代碼安全分析**: 通過" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **代碼安全分析**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # CodeQL 分析結果
          if [ "${{ needs.codeql-analysis.result }}" == "success" ]; then
            echo "✅ **CodeQL 分析**: 通過" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **CodeQL 分析**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 合規性檢查結果
          if [ "${{ needs.compliance-check.result }}" == "success" ]; then
            echo "✅ **合規性檢查**: 通過" >> $GITHUB_STEP_SUMMARY
            passed_checks=$((passed_checks + 1))
          else
            echo "❌ **合規性檢查**: 失敗" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 計算通過率
          pass_rate=$((passed_checks * 100 / total_checks))
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 檢查統計" >> $GITHUB_STEP_SUMMARY
          echo "- **總檢查項**: $total_checks" >> $GITHUB_STEP_SUMMARY
          echo "- **通過項目**: $passed_checks" >> $GITHUB_STEP_SUMMARY
          echo "- **通過率**: ${pass_rate}%" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🎯 安全建議" >> $GITHUB_STEP_SUMMARY
          echo "- 定期更新依賴套件" >> $GITHUB_STEP_SUMMARY
          echo "- 監控 CodeQL 安全警告" >> $GITHUB_STEP_SUMMARY
          echo "- 檢查機密檢測報告" >> $GITHUB_STEP_SUMMARY
          echo "- 遵循安全編碼最佳實踐" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **詳細報告請查看各 Job 的 Artifacts 和 Security 標籤**" >> $GITHUB_STEP_SUMMARY
          
          # 設定整體狀態
          if [ $pass_rate -ge 75 ]; then
            echo "🎉 安全檢查總體通過 (${pass_rate}%)"
          elif [ $pass_rate -ge 50 ]; then
            echo "⚠️ 安全檢查部分通過 (${pass_rate}%)，需要改進"
          else
            echo "❌ 安全檢查未達標 (${pass_rate}%)，需要立即關注"
          fi

      - name: 🎯 檢查關鍵失敗項目
        if: |
          needs.secrets-detection.result == 'failure' || 
          needs.codeql-analysis.result == 'failure'
        run: |
          echo "⚠️ 關鍵安全檢查失敗"
          echo "機密檢測: ${{ needs.secrets-detection.result }}"
          echo "CodeQL 分析: ${{ needs.codeql-analysis.result }}"
          echo "代碼安全分析: ${{ needs.code-security-analysis.result }}"
          echo "合規檢查: ${{ needs.compliance-check.result }}"
          # 不強制失敗，讓用戶決定是否需要修復