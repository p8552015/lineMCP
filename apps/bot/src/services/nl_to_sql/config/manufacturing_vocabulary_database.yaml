# 製造業詞彙庫資料庫
# 支援 LLM 自動解譯和多欄位資料提取
# 使用者可收集相關資料來更新此檔案

vocabulary_database:
  version: "1.0.0"
  last_updated: "2025-06-28"
  total_entries: 156
  
  # 設備機台相關詞彙
  equipment:
    machine_identifiers:
      - term: "M001"
        type: "machine_id"
        synonyms: ["M-001", "機台M001", "Machine M001", "CNC車床A"]
        extraction_patterns:
          - "M\\d{3}"
          - "M-\\d{3}"
          - "機台M\\d{3}"
          - "Machine M\\d{3}"
        field_mappings:
          machine_id: "M001"
          machine_type: "CNC_LATHE"
          department: "production_line_1"
        confidence_weight: 0.95
        
      - term: "M002"
        type: "machine_id"
        synonyms: ["M-002", "機台M002", "Machine M002", "銑床B"]
        extraction_patterns:
          - "M\\d{3}"
          - "銑床[A-Z]"
        field_mappings:
          machine_id: "M002"
          machine_type: "MILLING_MACHINE"
          department: "production_line_1"
        confidence_weight: 0.95
        
      - term: "生產線A"
        type: "production_line"
        synonyms: ["Line-A", "產線A", "Production Line A", "第一生產線"]
        extraction_patterns:
          - "生產線[A-Z]"
          - "Line-[A-Z]"
          - "產線[A-Z]"
          - "第[一二三四五]生產線"
        field_mappings:
          production_line_id: "LINE_A"
          department: "manufacturing"
        confidence_weight: 0.90
        
    machine_types:
      - term: "CNC車床"
        type: "machine_type"
        synonyms: ["CNC lathe", "車床", "數控車床", "電腦車床"]
        extraction_patterns:
          - "CNC車床"
          - "數控車床"
          - "電腦車床"
        field_mappings:
          machine_type: "CNC_LATHE"
          category: "machining"
        confidence_weight: 0.88
        
      - term: "銑床"
        type: "machine_type" 
        synonyms: ["milling machine", "銑削機", "立式銑床", "臥式銑床"]
        extraction_patterns:
          - "銑床"
          - "銑削機"
          - "[立臥]式銑床"
        field_mappings:
          machine_type: "MILLING_MACHINE"
          category: "machining"
        confidence_weight: 0.88

  # 生產指標相關詞彙
  metrics:
    performance_indicators:
      - term: "稼動率"
        type: "metric_type"
        synonyms: ["utilization rate", "設備利用率", "機台使用率", "稼働率", "utilization", "使用率"]
        extraction_patterns:
          - "稼動率"
          - "稼働率"
          - "使用率"
          - "利用率"
          - "utilization"
        field_mappings:
          metric_type: "utilization_rate"
          metric_category: "efficiency"
          unit: "percentage"
        calculation_formula: "(actual_run_time / planned_run_time) * 100"
        confidence_weight: 0.95
        
      - term: "OEE"
        type: "metric_type"
        synonyms: ["整體設備效率", "Overall Equipment Effectiveness", "設備綜合效率", "綜合效率"]
        extraction_patterns:
          - "OEE"
          - "整體設備效率"
          - "設備綜合效率"
          - "綜合效率"
        field_mappings:
          metric_type: "oee"
          metric_category: "overall_performance"
          unit: "percentage"
        calculation_formula: "availability * performance * quality"
        confidence_weight: 0.92
        
      - term: "不良率"
        type: "metric_type"
        synonyms: ["defect rate", "瑕疵率", "次品率", "不合格率", "品質問題率"]
        extraction_patterns:
          - "不良率"
          - "瑕疵率"
          - "次品率"
          - "不合格率"
          - "defect rate"
        field_mappings:
          metric_type: "defect_rate"
          metric_category: "quality"
          unit: "percentage"
        calculation_formula: "(defective_units / total_units) * 100"
        confidence_weight: 0.90
        
      - term: "產量"
        type: "metric_type"
        synonyms: ["throughput", "產出", "生產量", "output", "production volume"]
        extraction_patterns:
          - "產量"
          - "產出"
          - "生產量"
          - "throughput"
          - "output"
        field_mappings:
          metric_type: "throughput"
          metric_category: "productivity"
          unit: "pieces_per_hour"
        confidence_weight: 0.88

  # 時間維度相關詞彙
  time_dimensions:
    real_time:
      - term: "即時"
        type: "time_period"
        synonyms: ["real-time", "實時", "當前", "現在", "目前", "real time"]
        extraction_patterns:
          - "即時"
          - "實時"
          - "當前"
          - "現在"
          - "目前"
          - "real.time"
        field_mappings:
          time_period: "real_time"
          time_range: "current"
        confidence_weight: 0.93
        
    periodic:
      - term: "今天"
        type: "time_period"
        synonyms: ["today", "本日", "當日", "今日"]
        extraction_patterns:
          - "今天"
          - "今日"
          - "本日"
          - "當日"
          - "today"
        field_mappings:
          time_period: "daily"
          time_range: "today"
        confidence_weight: 0.95
        
      - term: "本週"
        type: "time_period"
        synonyms: ["this week", "這週", "本星期", "這個星期", "當週"]
        extraction_patterns:
          - "本週"
          - "這週"
          - "本星期"
          - "這個星期"
          - "當週"
          - "this week"
        field_mappings:
          time_period: "weekly"
          time_range: "this_week"
        confidence_weight: 0.92
        
      - term: "本月"
        type: "time_period"
        synonyms: ["this month", "這個月", "當月", "本月份"]
        extraction_patterns:
          - "本月"
          - "這個月"
          - "當月"
          - "本月份"
          - "this month"
        field_mappings:
          time_period: "monthly"
          time_range: "this_month"
        confidence_weight: 0.90

  # 組織結構相關詞彙
  organizational:
    departments:
      - term: "生產部門"
        type: "department"
        synonyms: ["production", "製造部", "生產部", "manufacturing", "生產單位"]
        extraction_patterns:
          - "生產部門"
          - "製造部"
          - "生產部"
          - "production"
          - "manufacturing"
        field_mappings:
          department: "production"
          department_type: "manufacturing"
        confidence_weight: 0.88
        
      - term: "品質部門"
        type: "department"
        synonyms: ["quality", "品保", "QC", "QA", "品質管制", "品質保證"]
        extraction_patterns:
          - "品質部門"
          - "品保"
          - "QC"
          - "QA"
          - "品質管制"
          - "quality"
        field_mappings:
          department: "quality"
          department_type: "quality_control"
        confidence_weight: 0.90
        
    shifts:
      - term: "早班"
        type: "shift_type"
        synonyms: ["morning shift", "白班", "日班", "第一班", "A班"]
        extraction_patterns:
          - "早班"
          - "白班"
          - "日班"
          - "第一班"
          - "[A]班"
          - "morning shift"
        field_mappings:
          shift_type: "morning"
          shift_code: "A"
          start_time: "08:00"
          end_time: "16:00"
        confidence_weight: 0.85
        
      - term: "晚班"
        type: "shift_type"
        synonyms: ["evening shift", "夜班", "第二班", "B班", "晚上班"]
        extraction_patterns:
          - "晚班"
          - "夜班"
          - "第二班"
          - "[B]班"
          - "evening shift"
        field_mappings:
          shift_type: "evening"
          shift_code: "B"
          start_time: "16:00"
          end_time: "24:00"
        confidence_weight: 0.85

  # 複合查詢模式
  composite_patterns:
    machine_metric_combinations:
      - pattern: "{machine_id}機台{metric_type}"
        example: "M001機台稼動率"
        extraction_logic: "extract_machine_id_and_metric"
        confidence_boost: 0.15
        
      - pattern: "{department}{time_period}的{metric_type}"
        example: "生產部門本週的OEE指標"
        extraction_logic: "extract_department_time_metric"
        confidence_boost: 0.12
        
      - pattern: "{machine_type}{time_period}{metric_type}"
        example: "CNC車床今天不良率"
        extraction_logic: "extract_type_time_metric"
        confidence_boost: 0.10

  # LLM 解譯增強配置
  llm_enhancement:
    prompt_templates:
      field_extraction: |
        請從以下製造業查詢中提取結構化資料：
        查詢：{user_query}
        
        參考詞彙庫：{vocabulary_context}
        
        請以 JSON 格式返回：
        {{
          "machine_id": "機台編號",
          "metric_type": "指標類型", 
          "time_period": "時間範圍",
          "department": "部門",
          "confidence": "信心度(0-1)"
        }}
        
      validation_prompt: |
        請驗證以下解譯結果是否合理：
        原始查詢：{original_query}
        解譯結果：{interpretation_result}
        
        請回答：
        1. 解譯是否正確？(是/否)
        2. 信心度評估 (0-1)
        3. 建議改善 (如果有錯誤)
        
    confidence_calculation:
      base_confidence: 0.5
      pattern_match_bonus: 0.3
      vocabulary_match_bonus: 0.2
      context_coherence_bonus: 0.15
      penalty_for_ambiguity: -0.1
      
    fallback_strategies:
      - name: "exact_pattern_match"
        priority: 1
        description: "精確模式匹配"
        
      - name: "fuzzy_string_matching" 
        priority: 2
        description: "模糊字串匹配"
        
      - name: "semantic_similarity"
        priority: 3
        description: "語義相似度匹配"
        
      - name: "user_feedback_learning"
        priority: 4
        description: "從使用者回饋學習"

# 使用者更新指南
update_guidelines:
  adding_new_terms:
    steps:
      1. "確定詞彙類別 (equipment/metrics/time_dimensions/organizational)"
      2. "填寫主要詞彙和同義詞"
      3. "定義提取模式（支援正則表達式）"
      4. "設定欄位映射"
      5. "設定信心度權重 (0.0-1.0)"
      
  validation_checklist:
    - "詞彙無重複"
    - "同義詞完整且正確"
    - "提取模式測試通過"
    - "欄位映射符合資料庫 schema"
    - "信心度權重合理"
    
  testing_examples:
    - input: "M001機台稼動率"
      expected_output:
        machine_id: "M001"
        metric_type: "utilization_rate"
        confidence: "> 0.9"
        
    - input: "生產部門本週OEE指標"
      expected_output:
        department: "production"
        time_period: "weekly"
        metric_type: "oee"
        confidence: "> 0.85"