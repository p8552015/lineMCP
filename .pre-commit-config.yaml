repos:
  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        args: [--line-length=88]
        files: ^apps/bot/src/
        
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore, E501]
        files: ^apps/bot/src/
        
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.3.0
    hooks:
      - id: mypy
        files: ^apps/bot/src/
        additional_dependencies: [
          types-requests,
          types-PyYAML,
          types-python-jose,
          types-redis,
          types-aiofiles,
          types-psutil,
          types-sqlalchemy
        ]
        args: [--config-file=apps/bot/pyproject.toml]