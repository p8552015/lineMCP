version: '3.8'

# 生產環境 Docker Compose 配置
# 使用方式: docker-compose -f docker-compose.prod.yml up -d

services:
  # LINE Bot 應用 - 生產環境 (多副本)
  bot:
    build:
      context: ./apps/bot
      dockerfile: Dockerfile
      target: production
    image: line-mcp-bot:latest
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
      - REDIS_URL=redis://redis-cluster:6379/0
      - MCP_SQLITE_SERVER_URL=http://mcp-sqlite-prod:3000
      - POSTGRES_URL=postgresql://line_mcp:${POSTGRES_PASSWORD}@postgres-primary:5432/line_mcp_prod
      - ASYNCIO_FORCE_SELECT_SELECTOR=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger-prod:14268
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
      - SENTRY_DSN=${SENTRY_DSN}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
    env_file:
      - .env.prod
    volumes:
      - ./data:/app/data:ro
      - prod-logs:/app/logs
    depends_on:
      - redis-cluster
      - mcp-sqlite-prod
      - postgres-primary
    networks:
      - line-mcp-prod
      - line-mcp-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        tag: "prod.bot"
        fluentd-retry-wait: "1s"
        fluentd-max-retries: "10"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bot-prod.rule=Host(`api.line-mcp.com`)"
      - "traefik.http.routers.bot-prod.tls=true"
      - "traefik.http.routers.bot-prod.tls.certresolver=letsencrypt"
      - "traefik.http.services.bot-prod.loadbalancer.server.port=8000"
      - "traefik.http.services.bot-prod.loadbalancer.healthcheck.path=/health"

  # MCP SQLite 服務器 - 生產環境 (HA)
  mcp-sqlite-prod:
    build:
      context: ./apps/servers/src/sqlite
      dockerfile: Dockerfile
    image: mcp-sqlite:latest
    restart: always
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=WARNING
      - DB_PATH=/data/production.db
      - BACKUP_ENABLED=true
      - BACKUP_SCHEDULE="0 1 * * *"  # 每日凌晨1點備份
      - BACKUP_RETENTION_DAYS=30
      - READ_REPLICA_ENABLED=true
    volumes:
      - ./data/sqlite:/data
      - prod-logs:/app/logs
      - prod-backups:/backups
    networks:
      - line-mcp-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        tag: "prod.mcp-sqlite"

  # PostgreSQL 主資料庫 - 生產環境
  postgres-primary:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=line_mcp_prod
      - POSTGRES_USER=line_mcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
      - POSTGRES_INITDB_ARGS=--auth-host=md5
      - PGUSER=line_mcp
      - POSTGRES_HOST_AUTH_METHOD=md5
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./config/postgres/postgresql.primary.conf:/etc/postgresql/postgresql.conf:ro
      - prod-backups:/backups
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby=on
    networks:
      - line-mcp-internal
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "line_mcp", "-d", "line_mcp_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # PostgreSQL 讀取副本
  postgres-replica:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=line_mcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_PRIMARY_HOST=postgres-primary
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
      - PGUSER=line_mcp
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./config/postgres/postgresql.replica.conf:/etc/postgresql/postgresql.conf:ro
    command: >
      bash -c "
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -W -v -P
          echo 'standby_mode = on' >> /var/lib/postgresql/data/postgresql.conf
          echo 'primary_conninfo = ''host=postgres-primary port=5432 user=replicator''' >> /var/lib/postgresql/data/postgresql.conf
        fi
        postgres -c config_file=/etc/postgresql/postgresql.conf
      "
    depends_on:
      - postgres-primary
    networks:
      - line-mcp-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Redis Cluster - 生產環境
  redis-cluster:
    image: redis:7-alpine
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD}
        --appendonly yes
        --cluster-enabled yes
        --cluster-config-file nodes.conf
        --cluster-node-timeout 5000
        --maxmemory 1gb
        --maxmemory-policy allkeys-lru
    volumes:
      - redis-cluster-data:/data
      - ./config/redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - line-mcp-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 6  # 3 master + 3 replica
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Traefik 負載均衡器
  traefik:
    image: traefik:v3.0
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Dashboard
    environment:
      - TRAEFIK_API_DASHBOARD=true
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.prod.yml:/etc/traefik/traefik.yml:ro
      - traefik-ssl:/ssl
      - prod-logs:/logs
    networks:
      - line-mcp-prod
      - line-mcp-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Prometheus - 指標收集 (HA)
  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./config/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-prod-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--web.external-url=https://prometheus.line-mcp.com'
    networks:
      - line-mcp-internal
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # Grafana - 監控儀表板
  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=redis-datasource,postgres-datasource
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres-primary:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${GRAFANA_DB_PASSWORD}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres-primary
    networks:
      - line-mcp-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.line-mcp.com`)"
      - "traefik.http.routers.grafana.tls=true"

  # Jaeger - 分散式追蹤
  jaeger-prod:
    image: jaegertracing/all-in-one:latest
    restart: always
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - line-mcp-internal

  # Elasticsearch - 日誌和追蹤存儲
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - line-mcp-internal
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'

  # Fluentd - 生產環境日誌聚合
  fluentd:
    build:
      context: ./infra/fluentd
      dockerfile: Dockerfile.prod
    restart: always
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    volumes:
      - prod-logs:/fluentd/log
      - ./config/fluentd/fluent.prod.conf:/fluentd/etc/fluent.conf:ro
    depends_on:
      - elasticsearch
    networks:
      - line-mcp-internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # 備份服務
  backup-service:
    build:
      context: ./infra/backup
      dockerfile: Dockerfile
    restart: always
    environment:
      - BACKUP_SCHEDULE="0 2 * * *"  # 每日凌晨2點
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - RETENTION_DAYS=30
    volumes:
      - prod-backups:/backups
      - postgres-primary-data:/postgres-data:ro
      - redis-cluster-data:/redis-data:ro
      - ./config/backup/backup.prod.yml:/app/config.yml:ro
    depends_on:
      - postgres-primary
      - redis-cluster
    networks:
      - line-mcp-internal

  # 監控告警
  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    volumes:
      - ./config/alertmanager/alertmanager.prod.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://alerts.line-mcp.com'
    networks:
      - line-mcp-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=Host(`alerts.line-mcp.com`)"

volumes:
  postgres-primary-data:
    driver: local
  postgres-replica-data:
    driver: local
  redis-cluster-data:
    driver: local
  prometheus-prod-data:
    driver: local
  elasticsearch-data:
    driver: local
  alertmanager-data:
    driver: local
  traefik-ssl:
    driver: local
  prod-logs:
    driver: local
  prod-backups:
    driver: local

networks:
  line-mcp-prod:
    driver: bridge
    external: true
  line-mcp-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.22.0.0/16

# 生產環境安全配置
secrets:
  postgres_password:
    external: true
  redis_password:
    external: true
  grafana_password:
    external: true

# Swarm 模式配置模板
x-deploy-defaults: &deploy-defaults
  restart_policy:
    condition: on-failure
    delay: 5s
    max_attempts: 3
  update_config:
    parallelism: 1
    delay: 10s
    failure_action: rollback